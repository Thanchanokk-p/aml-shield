name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          pip install pytest
          pip install -r requirements.txt

      - name: Run smoke tests
        run: pytest tests/test_api_health.py -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Tag current image as rollback point
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker tag aml-shield:v1 aml-shield:previous || true

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/aml-shield-main
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # ── Disk space safety check ──────────────────────────
            # Check if available disk space is under 2GB.
            # If so, clean Docker cache automatically before building.
            AVAILABLE_KB=$(df --output=avail / | tail -1)
            AVAILABLE_GB=$((AVAILABLE_KB / 1024 / 1024))
            echo "Disk space available: ${AVAILABLE_GB}GB"
            if [ "$AVAILABLE_GB" -lt 2 ]; then
              echo "WARNING: Low disk space (<2GB). Cleaning Docker cache..."
              docker system prune -a -f
              AVAILABLE_KB=$(df --output=avail / | tail -1)
              AVAILABLE_GB=$((AVAILABLE_KB / 1024 / 1024))
              echo "Disk space after cleanup: ${AVAILABLE_GB}GB"
            fi

            docker build -t aml-shield:v1 .
            docker rm -f aml-shield
            docker run -d -p 8000:8000 --restart unless-stopped --name aml-shield aml-shield:v1

            # Retry health check up to 6 times (30s max) instead of a fixed sleep
            HEALTHY=false
            for i in 1 2 3 4 5 6; do
              sleep 5
              if curl -sf http://localhost:8000/health > /dev/null; then
                HEALTHY=true
                break
              fi
              echo "Health check attempt $i failed, retrying..."
            done

            if [ "$HEALTHY" = "false" ]; then
              echo "Health check failed. Rolling back to previous image..."
              docker rm -f aml-shield
              docker run -d -p 8000:8000 --restart unless-stopped --name aml-shield aml-shield:previous
              exit 1
            fi
            echo "Deployment healthy."
