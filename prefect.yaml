# Welcome to your prefect.yaml file! You can use this file for
# storing and managing configuration for deploying your flows.
# We recommend committing this file to source control along
# with your flow code.

# Generic metadata about this project
name: aml-shield-main
prefect-version: 3.7.8

# build section allows you to manage and build docker images
build:

# push section allows you to manage if and how this project
# is uploaded to remote locations
push:

# pull section allows you to provide instructions for cloning
# this project in remote locations
pull:
- prefect.deployments.steps.set_working_directory:
    directory: /Users/fripuran/aml-shield-main

# the deployments section allows you to provide configuration
# for deploying flows
deployments:
- name: aml-shield-training
  version:
  tags: []
  concurrency_limit:
  description: Full training pipeline — load → split → train → log.
  entrypoint: src/pipeline.py:training_pipeline
  parameters: {}
  work_pool:
    name: local-pool
    work_queue_name:
    job_variables: {}
  schedules:
  - cron: 0 19 * * *
    timezone: Europe/London
    day_or: true
    active: true
- name: aml-shield-drift-check
  version:
  tags: []
  concurrency_limit:
  description: Compare reference (older 70%) vs current (newer 30%) data slices.
  entrypoint: src/monitoring.py:run_drift_check
  parameters: {}
  work_pool:
    name: local-pool
    work_queue_name:
    job_variables: {}
  schedules:
  - cron: '30 20 * * * '
    timezone: Europe/London
    day_or: true
    active: true
